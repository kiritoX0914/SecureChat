name: Build SecureChat iOS

on:
  push:
    branches: [ main, master, lan-fix ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package iOS App
    runs-on: macos-15-intel # arm64 macos-15/macos-latest stayed queued; intel pool acquired a runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: |
          xcodebuild -version
          xcrun swift -version

      - name: Build for iOS Simulator (Debug)
        run: |
          xcodebuild build \
            -project SecureChat.xcodeproj \
            -scheme SecureChat \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build iOS Archive (Release)
        run: |
          xcodebuild archive \
            -project SecureChat.xcodeproj \
            -scheme SecureChat \
            -destination "generic/platform=iOS" \
            -archivePath "build/SecureChat.xcarchive" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Install ldid
        run: |
          set -euo pipefail
          brew install ldid-procursus
          which ldid
          ldid 2>&1 | head -n 5 || true

      - name: Package fake-signed IPA
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R "build/SecureChat.xcarchive/Products/Applications/SecureChat.app" build/Payload/

          APP="build/Payload/SecureChat.app"
          BIN="$APP/SecureChat"
          PLIST="$APP/Info.plist"
          ENTITLEMENTS="SecureChat.entitlements"

          test -x "$BIN"
          test -f "$ENTITLEMENTS"

          # Info.plist must keep the keys TrollStore and Local Network privacy need.
          for key in CFBundleExecutable NSLocalNetworkUsageDescription NSBonjourServices; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" >/dev/null
            echo "OK $key"
          done

          # Xcode was built with CODE_SIGNING_ALLOWED=NO, so entitlements are not
          # embedded. Fake-sign with ldid so TrollStore preserves them.
          ldid -S"$ENTITLEMENTS" "$BIN"

          echo "===== ldid -e (embedded entitlements) ====="
          ldid -e "$BIN" | tee build/embedded-entitlements.xml
          grep -q "com.apple.developer.networking.multicast" build/embedded-entitlements.xml
          grep -q "kTCCServiceLocalNetwork" build/embedded-entitlements.xml
          grep -q "com.apple.security.network.client" build/embedded-entitlements.xml
          grep -q "com.apple.security.network.server" build/embedded-entitlements.xml

          cd build
          zip -qr "SecureChat-v1.2.ipa" Payload
          shasum -a 256 "SecureChat-v1.2.ipa" | tee SHA256SUMS
          ls -lh "SecureChat-v1.2.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureChat-v1.2-ipa
          path: |
            build/SecureChat-v1.2.ipa
            build/SHA256SUMS
            build/embedded-entitlements.xml
          retention-days: 14
