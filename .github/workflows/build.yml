name: Build SecureChat iOS

on:
  push:
    branches: [ main, master, lan-fix ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package iOS App
    runs-on: macos-15-intel # arm64 macos-15/macos-latest stayed queued; intel pool acquired a runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: |
          xcodebuild -version
          xcrun swift -version

      - name: Build for iOS Simulator (Debug)
        run: |
          set -o pipefail
          xcodebuild build \
            -project SecureChat.xcodeproj \
            -scheme SecureChat \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | tee build-sim.log
          echo "== SDK =="; xcrun --sdk iphoneos --show-sdk-version
          echo "== warnings mentioning iOS 17/18 deprecations =="
          grep -E "deprecated in iOS 1[78]" build-sim.log | sort -u || echo "none"

      - name: iOS 18 simulator launch smoke test
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import json,sys
          rs=[r for r in json.load(sys.stdin)['runtimes'] if r['isAvailable'] and r['platform']=='iOS' and r['version'].startswith('18')]
          rs.sort(key=lambda r:[int(x) for x in r['version'].split('.')])
          pref=[r for r in rs if r['version'].startswith('18.5')]
          print((pref or rs)[-1]['identifier'])")
          echo "Runtime: $RUNTIME"
          DEVTYPE=$(xcrun simctl list devicetypes -j | python3 -c "
          import json,sys
          ts=[t['identifier'] for t in json.load(sys.stdin)['devicetypes'] if 'iPhone-16' in t['identifier'] or 'iPhone-15' in t['identifier']]
          print(ts[0])")
          UDID=$(xcrun simctl create sc-smoke "$DEVTYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/sim/Build/Products -name "SecureChat.app" -maxdepth 3 | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.securechat.SecureChat
          sleep 20
          xcrun simctl spawn "$UDID" launchctl list | grep -i securechat
          xcrun simctl io "$UDID" screenshot build/ios18-sim.png
          echo "App still running on $(xcrun simctl list devices | grep sc-smoke)"

      - name: Build iOS Archive (Release)
        run: |
          xcodebuild archive \
            -project SecureChat.xcodeproj \
            -scheme SecureChat \
            -destination "generic/platform=iOS" \
            -archivePath "build/SecureChat.xcarchive" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Install ldid
        run: |
          set -euo pipefail
          brew install ldid-procursus
          which ldid
          ldid 2>&1 | head -n 5 || true

      - name: Package fake-signed IPA
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R "build/SecureChat.xcarchive/Products/Applications/SecureChat.app" build/Payload/

          APP="build/Payload/SecureChat.app"
          BIN="$APP/SecureChat"
          PLIST="$APP/Info.plist"
          ENTITLEMENTS="SecureChat.entitlements"

          test -x "$BIN"
          test -f "$ENTITLEMENTS"

          # Info.plist must keep the keys TrollStore and Local Network privacy need.
          for key in CFBundleExecutable NSLocalNetworkUsageDescription NSBonjourServices; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" >/dev/null
            echo "OK $key"
          done

          # App icon: SpringBoard / the app switcher / TrollStore read the loose
          # CFBundleIconFiles PNGs, so every iPhone + iPad size must be present
          # and referenced (not just the 1024 inside Assets.car).
          # actool (iOS 16 target) only emits 60x60@2x + 76x76@2x~ipad as loose
          # files; ship every size loose (TrollStore/SpringBoard/app switcher read
          # these) and list them all in CFBundleIconFiles for iPhone and iPad.
          for f in packaging/icons/*.png; do cp -n "$f" "$APP/"; done
          PB=/usr/libexec/PlistBuddy
          $PB -c "Delete :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles" "$PLIST"
          $PB -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" "$PLIST"
          i=0; for n in SecureChatIcon20x20 SecureChatIcon29x29 SecureChatIcon40x40 SecureChatIcon60x60; do
            $PB -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:$i string $n" "$PLIST"; i=$((i+1)); done
          $PB -c "Delete :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconFiles" "$PLIST"
          $PB -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconFiles array" "$PLIST"
          i=0; for n in SecureChatIcon20x20 SecureChatIcon29x29 SecureChatIcon40x40 SecureChatIcon60x60 SecureChatIcon76x76 SecureChatIcon83.5x83.5; do
            $PB -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconFiles:$i string $n" "$PLIST"; i=$((i+1)); done

          echo "===== CFBundleIcons ====="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons~ipad" "$PLIST"
          ls -l "$APP"/*.png
          # The old v1.0-1.4 names must be gone so no name-keyed icon cache can hit.
          if ls "$APP"/AppIcon*.png >/dev/null 2>&1; then echo "stale AppIcon*.png present"; exit 1; fi
          for f in SecureChatIcon20x20@2x SecureChatIcon20x20@3x SecureChatIcon29x29@2x SecureChatIcon29x29@3x \
                   SecureChatIcon40x40@2x SecureChatIcon40x40@3x SecureChatIcon60x60@2x SecureChatIcon60x60@3x \
                   SecureChatIcon76x76@2x~ipad SecureChatIcon83.5x83.5@2x~ipad; do
            test -s "$APP/$f.png" || { echo "MISSING $f.png"; exit 1; }
            echo "OK $f.png"
          done
          for n in SecureChatIcon20x20 SecureChatIcon29x29 SecureChatIcon40x40 SecureChatIcon60x60; do
            /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles" "$PLIST" | grep -q "$n" || { echo "plist missing $n"; exit 1; }
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$PLIST")" = SecureChatIcon
          # No stray icon files from other/old sets anywhere in the bundle.
          find "$APP" -iname '*icon*' -o -iname '*lock*' | sort

          # Xcode was built with CODE_SIGNING_ALLOWED=NO, so entitlements are not
          # embedded. Fake-sign with ldid so TrollStore preserves them.
          ldid -S"$ENTITLEMENTS" "$BIN"

          echo "===== ldid -e (embedded entitlements) ====="
          ldid -e "$BIN" | tee build/embedded-entitlements.xml
          grep -q "com.apple.developer.networking.multicast" build/embedded-entitlements.xml
          grep -q "kTCCServiceLocalNetwork" build/embedded-entitlements.xml
          grep -q "com.apple.security.network.client" build/embedded-entitlements.xml
          grep -q "com.apple.security.network.server" build/embedded-entitlements.xml

          cd build
          zip -qr "SecureChat-v1.5.ipa" Payload
          shasum -a 256 "SecureChat-v1.5.ipa" | tee SHA256SUMS
          ls -lh "SecureChat-v1.5.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureChat-v1.5-ipa
          path: |
            build/SecureChat-v1.5.ipa
            build/SHA256SUMS
            build/embedded-entitlements.xml
            build/ios18-sim.png
          retention-days: 14
