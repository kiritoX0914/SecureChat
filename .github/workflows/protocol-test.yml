name: Protocol test (headless, multi-process)

on:
  push:
    branches: [ lan-fix ]
  workflow_dispatch:

jobs:
  protocol:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Run multi-process protocol test
        run: ./ProtocolTests/run.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crypto interop vectors (Swift app crypto <-> Python reference from PROTOCOL.md)
        run: ./ProtocolTests/vectors/run.sh "$RUNNER_TEMP/vectors"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-vectors
          path: |
            ${{ runner.temp }}/vectors/PROTOCOL-vectors.json
            ${{ runner.temp }}/vectors/python-replies.json
