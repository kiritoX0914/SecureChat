name: SecureChat
options:
  bundleIdPrefix: com.securechat
  deploymentTarget:
    iOS: "16.5"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "16.5"
    PRODUCT_NAME: SecureChat
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_PREVIEWS: YES
    CLANG_ENABLE_MODULES: YES
    ALWAYS_SEARCH_USER_PATHS: NO

targets:
  SecureChat:
    type: application
    platform: iOS
    deploymentTarget: "16.5"
    sources:
      - path: SecureChat
        excludes:
          - "**/*.plist"
    info:
      path: SecureChat/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.securechat.SecureChat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: SecureChat/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
